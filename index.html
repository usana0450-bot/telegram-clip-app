<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Viral Clip Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400 flex items-center justify-center gap-2">
                ⚡ AI Video Clipper
            </h1>
            <p class="text-xs text-slate-400 mt-1">Paste YouTube Long Video URL & Get Viral Short Clips</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">YouTube Video Link</label>
                <input type="text" id="ytUrl" placeholder="https://youtu.be/..." class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-blue-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Start Time (Sec)</label>
                    <input type="number" id="startTime" value="15" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Duration (Sec)</label>
                    <input type="number" id="duration" value="30" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <button id="convertBtn" onclick="processClip()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-500/20">
                🎬 Generate Clip
            </button>
        </div>

        <div id="status" class="hidden mt-6 text-center">
            <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-blue-400 mb-2"></div>
            <p class="text-xs text-yellow-400">Processing Video... Please wait (~15-30s)</p>
        </div>

        <div id="result" class="hidden mt-6 text-center">
            <p class="text-green-400 text-sm font-semibold mb-3">✅ Clip Ready!</p>
            <a id="downloadBtn" href="#" target="_blank" class="block w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl transition duration-200 text-center">
                ⬇️ Download Clip
            </a>
        </div>
    </div>

    <script>
        let currentDownloadUrl = "";

        async function processClip() {
            const url = document.getElementById('ytUrl').value;
            const start = parseInt(document.getElementById('startTime').value);
            const duration = parseInt(document.getElementById('duration').value);

            if (!url) { alert("Please paste a valid YouTube URL"); return; }

            document.getElementById('status').classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('convertBtn').disabled = true;

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, start, duration })
                });

                const data = await response.json();
                if (data.status === "success") {
                    document.getElementById('status').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                    
                    currentDownloadUrl = data.download_url;
                    document.getElementById('downloadBtn').href = currentDownloadUrl;
                } else {
                    alert("Error: " + (data.message || "Failed to process video"));
                }
            } catch (err) {
                alert("Error processing video. Please check network or API route.");
            } finally {
                document.getElementById('status').classList.add('hidden');
                document.getElementById('convertBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
