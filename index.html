<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Viral Clip Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-3xl w-full my-8 text-center">
    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
      ⚡ AI Viral Clip Generator
    </h1>
    <p class="text-gray-400 text-sm">Paste long YouTube URL & Auto-Extract 5 Playable Viral Short Clips</p>
  </div>

  <div class="max-w-3xl w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
    <div class="mb-6">
      <label class="block text-gray-300 text-sm font-semibold mb-2">YouTube Video URL</label>
      <input type="text" id="youtubeUrl" placeholder="https://youtu.be/..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">
    </div>

    <button onclick="generateClips()" id="btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg">
      🪄 Auto-Generate 5 Viral Clips
    </button>

    <div id="loader" class="hidden text-center py-8">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-500 border-t-transparent mb-2"></div>
      <p class="text-gray-400 text-sm">Extracting 5 Best Viral Hooks... Please wait (~20s)</p>
    </div>
  </div>

  <!-- Clips Container -->
  <div id="clipsContainer" class="max-w-3xl w-full mt-8 space-y-6 hidden"></div>

  <script>
    async function generateClips() {
      const url = document.getElementById('youtubeUrl').value;
      const loader = document.getElementById('loader');
      const btn = document.getElementById('btn');
      const container = document.getElementById('clipsContainer');

      if (!url) return alert('Please enter YouTube URL');

      loader.classList.remove('hidden');
      btn.disabled = true;
      btn.classList.add('opacity-50');
      container.classList.add('hidden');
      container.innerHTML = '';

      try {
        const res = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (data.status === 'success') {
          data.clips.forEach(clip => {
            const card = document.createElement('div');
            card.className = "bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4";
            card.innerHTML = `
              <div class="w-full md:w-1/2">
                <video controls class="w-full rounded-lg border border-gray-800" src="${clip.videoUrl}"></video>
              </div>
              <div class="w-full md:w-1/2 flex flex-col justify-between">
                <div>
                  <h3 class="font-bold text-lg text-purple-300">${clip.title}</h3>
                  <p class="text-xs text-gray-400 mt-1">Duration: ${clip.duration}s | Timestamp: ${clip.start}s</p>
                </div>
                <a href="${clip.videoUrl}" download target="_blank" class="mt-4 inline-block text-center bg-green-600 hover:bg-green-500 font-semibold py-2 px-4 rounded-lg text-sm transition">
                  ⬇️ Download Clip
                </a>
              </div>
            `;
            container.appendChild(card);
          });
          container.classList.remove('hidden');
        } else {
          alert("Error: " + data.message);
        }
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        loader.classList.add('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>
